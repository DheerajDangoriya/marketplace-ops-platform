{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Products</h2>

        <table>
                <tr>
                            <th>SKU</th>
                                        <th>Name</th>
                                                    <th>Status</th>
                                                            </tr>
                                                                    {% for product in products %}
                                                                            <tr>
                                                                                        <td>{{ product.sku }}</td>
                                                                                                    <td>{{ product.name }}</td>
                                                                                                                <td>{{ "Active" if product.is_active else "Inactive" }}</td>
                                                                                                                        </tr>
                                                                                                                                {% endfor %}
                                                                                                                                    </table>
                                                                                                                                    </div>
                                                                                                                                    {% endblock %}
